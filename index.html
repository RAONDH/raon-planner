<h1>라온 플래너</h1>
<p>라온 플래너는 프랭클린 플래닝 방식(가치·목표, 우선순위 업무, 일일 기록)을 따르는 맥(macOS)용 개인 플래너 앱입니다.</p>
<ul>
  <li>구글 캘린더 일정을 보고 등록합니다.</li>
  <li>지메일의 새 메일과 중요 메일을 읽기 전용으로 확인합니다.</li>
  <li>구글 Tasks와 할 일을 동기화합니다.</li>
  <li>매일 아침 '오늘의 브리핑'과 저녁 '오늘 돌아보기' 창을 띄웁니다.</li>
</ul>
<p>개인 사용을 위해 만든 앱이며 판매하거나 배포하지 않습니다.</p>
